<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Обновления Outfit7</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
h1 { text-align:center; }

button {
  display:block;
  margin:20px auto;
  padding:12px 20px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
}

.game {
  background:white;
  margin:10px auto;
  max-width:700px;
  padding:12px;
  border-radius:10px;
  display:flex;
  gap:10px;
}

img { width:64px; border-radius:12px; }
</style>
</head>

<body>

<h1>Обновления Outfit7</h1>

<button onclick="load()">🔄 Обновить</button>

<div id="info"></div>
<div id="list"></div>

<script>
async function load() {
  const res = await fetch("updates.json?t=" + Date.now());
  const data = await res.json();

  document.getElementById("info").innerText =
    "Проверено: " + data.checked_at;

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.games.forEach(g => {
    list.innerHTML += `
      <div class="game">
        <img src="${g.icon}">
        <div>
          <b>${g.title}</b><br>
          ${g.updated_readable}<br>
          <a href="${g.url}" target="_blank">Открыть</a>
        </div>
      </div>
    `;
  });
}
</script>

</body>
</html>
